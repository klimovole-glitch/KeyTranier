[tool.poetry]
name = "keytrainer-analytics"
version = "0.1.0"
description = "Клавиатурный тренажер с аналитикой (KeyTrainer Analytics)"
authors = ["Климов Олег <klimovole@gmail.com>"]
readme = "README.md"
packages = [{ include = "keytrainer" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
matplotlib = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
flake8 = "^7.0"
flake8-docstrings = "^1.7"
pre-commit = "^3.7"
pyinstaller = "^6.0"

[tool.poetry.scripts]
keytrainer = "keytrainer.__main__:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
